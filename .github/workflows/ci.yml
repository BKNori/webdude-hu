name: Production CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript Strict Check
        run: npx tsc --noEmit

      - name: Run ESLint (0 warning kapu)
        run: npm run lint -- --max-warnings 0

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: "https://webdude.hu"
