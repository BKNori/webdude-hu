<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="BTShop.hu dashboard placeholder">
  <defs>
    <radialGradient id="glow2" cx="20%" cy="15%" r="70%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <pattern id="mesh2" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="#020617"/>
  <rect width="1600" height="900" fill="url(#mesh2)" opacity="0.5"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>
  <!-- Dashboard panel -->
  <rect x="120" y="110" width="1360" height="680" rx="24" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <circle cx="180" cy="160" r="10" fill="#ef4444" opacity="0.7"/>
  <circle cx="212" cy="160" r="10" fill="#00B5F1" opacity="0.7"/>
  <circle cx="244" cy="160" r="10" fill="#10b981" opacity="0.7"/>
  <rect x="300" y="150" width="500" height="20" rx="10" fill="#1e293b"/>
  <!-- KPI cards -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="170" y="220" width="380" height="150" rx="16" fill="#020617" stroke="#00B5F1" stroke-opacity="0.35"/>
    <text x="200" y="280" font-size="44" font-weight="800" fill="#00B5F1">3200+</text>
    <text x="200" y="325" font-size="20" fill="#94a3b8">aktív termék szinkronban</text>
    <rect x="590" y="220" width="380" height="150" rx="16" fill="#020617" stroke="#00B5F1" stroke-opacity="0.35"/>
    <text x="620" y="280" font-size="44" font-weight="800" fill="#00B5F1">100%</text>
    <text x="620" y="325" font-size="20" fill="#94a3b8">automatizált rendelés</text>
    <rect x="1010" y="220" width="420" height="150" rx="16" fill="#020617" stroke="#00B5F1" stroke-opacity="0.35"/>
    <text x="1040" y="280" font-size="44" font-weight="800" fill="#00B5F1">0</text>
    <text x="1040" y="325" font-size="20" fill="#94a3b8">manuális adminisztráció</text>
    <!-- Chart bars -->
    <rect x="170" y="430" width="70" height="200" rx="8" fill="#00B5F1" opacity="0.35"/>
    <rect x="270" y="380" width="70" height="250" rx="8" fill="#00B5F1" opacity="0.5"/>
    <rect x="370" y="440" width="70" height="190" rx="8" fill="#00B5F1" opacity="0.4"/>
    <rect x="470" y="330" width="70" height="300" rx="8" fill="#00B5F1" opacity="0.65"/>
    <rect x="570" y="290" width="70" height="340" rx="8" fill="#7C3AED" opacity="0.85"/>
    <rect x="670" y="240" width="70" height="390" rx="8" fill="#7C3AED"/>
    <!-- Sync lines -->
    <text x="820" y="470" font-size="22" font-weight="700" fill="#e2e8f0">Kulcs-Soft ⇄ WooCommerce</text>
    <line x1="820" y1="495" x2="1400" y2="495" stroke="#00B5F1" stroke-opacity="0.4" stroke-width="2"/>
    <text x="820" y="540" font-size="19" fill="#94a3b8">Valós idejű termékexport + megrendelés-import</text>
    <text x="820" y="600" font-size="22" font-weight="700" fill="#e2e8f0">Google Merchant Center feed</text>
    <line x1="820" y1="625" x2="1400" y2="625" stroke="#00B5F1" stroke-opacity="0.4" stroke-width="2"/>
    <text x="820" y="670" font-size="19" fill="#94a3b8">Napi szintű, automatizált termék-XML szinkron</text>
    <text x="800" y="855" text-anchor="middle" font-size="16" fill="#475569">DASHBOARD PLACEHOLDER — cserélendő: btshop-dashboard-placeholder.webp</text>
  </g>
